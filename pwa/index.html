:root{
  --bg:#0c0806;          /* menu leather */
  --page:#14100c;        /* page paper (dark) */
  --ink:#f7efe1;         /* cream text */
  --muted:#b8a588;       /* secondary text */
  --gold:#d9ae62;        /* gilt rules and accents */
  --gold-deep:#8a6a34;
  --glass:rgba(16,11,8,.78);
  --line:rgba(217,174,98,.34);
  --f-display:"Abar Mid","Abar High",Tahoma,sans-serif;
  --f-body:"Abar High",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);direction:rtl;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}

/* ---------- the page (dish) ---------- */
.stage{position:absolute;inset:0;perspective:1600px;overflow:hidden}
.page{position:absolute;inset:0;background:var(--page)}
/* the whole 9:16 frame is shown (no side crop on tall phones), so the dish sits further from the camera */
.page video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 46%;display:block}

/* gilt frame like the printed menu */
.frame{position:absolute;inset:max(10px,env(safe-area-inset-top,0px)) 10px 10px;border:1.5px solid var(--line);border-radius:18px;pointer-events:none;
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.0),inset 0 0 0 7px rgba(217,174,98,.12)}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(8,5,3,.82) 0%,rgba(8,5,3,0) 22%,rgba(8,5,3,0) 52%,rgba(8,5,3,.9) 82%,rgba(8,5,3,.97) 100%)}



/* ---------- top: brand + categories ---------- */
.top{position:absolute;inset:0 0 auto;z-index:8;padding-top:calc(env(safe-area-inset-top,0px) + 18px);
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .name{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:0;color:var(--ink)}
.brand .name b{color:var(--gold);font-weight:900}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);position:relative}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;gap:8px}
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:#1a120a;border-color:var(--gold)}
/* the dishes of the current category */
.items{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.items::-webkit-scrollbar{display:none}
.thumb{flex:none;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:14px;background:var(--glass);border:1px solid rgba(217,174,98,.2)}
.thumb img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.thumb span{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:2px}
.thumb[aria-pressed="true"]{border-color:var(--gold);background:rgba(217,174,98,.16)}
.thumb[aria-pressed="true"] span{color:var(--ink)}

/* ---------- bottom: dish card ---------- */
.card{position:absolute;inset:auto 0 0;z-index:8;overflow:hidden;padding:0 max(26px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(26px,env(safe-area-inset-left,0px))}
.card .cat{color:var(--gold);font-weight:800;font-size:14px;letter-spacing:0;display:flex;align-items:center;gap:10px}
.card .cat::before{content:"";width:22px;height:1.5px;background:var(--gold);opacity:.8}
.card h2{margin:6px 0 4px;font-family:var(--f-display);font-weight:900;font-size:clamp(25px,7.2vw,36px);line-height:1.35;text-wrap:balance;color:var(--ink)}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.85;max-width:34em;min-height:3.7em}
.card .price{flex:1 1 auto;min-width:0;color:var(--gold);font-family:var(--f-display);font-weight:900;font-size:clamp(17px,5.4vw,22px);white-space:nowrap;font-variant-numeric:tabular-nums}
.card .price small{font-family:var(--f-body);font-weight:700;font-size:14px;color:var(--muted)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;min-width:0}
.card .swap{min-width:0;overflow-wrap:anywhere}
.pager{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pager button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}
.pager button svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.card .swap{transition:opacity .25s ease,transform .25s ease}
.card .swap.out{opacity:0;transform:translateY(6px)}

/* ---------- intro (cover of the menu) ---------- */
.intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;
  padding:0 max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(24px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(10,6,4,.25),rgba(10,6,4,.6) 45%,rgba(10,6,4,.96) 78%),var(--intro-img,none) center/cover no-repeat,var(--bg);
  transition:opacity .6s ease,transform .6s ease}
.intro.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.intro .kicker{color:var(--gold);font-weight:800;font-size:15px;display:flex;align-items:center;gap:12px}
.intro .kicker::before,.intro .kicker::after{content:"";width:34px;height:1.5px;background:var(--gold);opacity:.75}
.intro h1{margin:12px 0 6px;font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,58px);line-height:1.3}
.intro h1 b{color:var(--gold);font-weight:900}
.intro p{margin:0 0 26px;color:var(--muted);font-size:16px;line-height:1.9;max-width:22em}
.cta:disabled{opacity:.75}
.cta{padding:16px 34px 13px;border-radius:999px;background:var(--gold);color:#1a120a;font-weight:800;font-size:18px;box-shadow:0 14px 40px rgba(217,174,98,.25)}
.credit{margin-top:22px;color:var(--muted);font-size:13px;direction:ltr;opacity:.8}

/* swipe hint */
.hint{position:absolute;z-index:9;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;
  padding:10px 18px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.hint.show{opacity:1;animation:nudge 1.6s ease-in-out 2}
.hint svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes nudge{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(calc(-50% - 16px),-50%)}}


@media (prefers-reduced-motion:reduce){.page video.rise{animation:none}.hint.show{animation:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <div class="page" id="page">
      <video id="vA" muted playsinline preload="auto"></video>
      <video id="vB" muted playsinline preload="auto" hidden></video>
      <div class="vignette"></div>
    </div>
    <div class="frame"></div>
  </div>

  <header class="top">
    <div class="brand">
      <div class="name" id="brandName">کافه <b>حوریا</b></div>
      <div class="tools">
        <button class="iconbtn" id="soundBtn" aria-label="صدا" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" opacity=".35"/></svg>
        </button>

      </div>
    </div>
    <nav class="cats" id="cats" aria-label="دسته‌بندی‌ها"></nav>
    <nav class="items" id="items" aria-label="غذاهای این دسته"></nav>
  </header>

  <section class="card" id="card" aria-live="polite">
    <div class="swap" id="swap">
      <div class="cat" id="dCat"></div>
      <h2 id="dName"></h2>
      <p id="dDesc"></p>
    </div>
    <div class="row">
      <div class="price" id="dPrice"></div>
      <div class="pager">
        <button id="prevBtn" aria-label="صفحه‌ی قبل"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <span id="pageNo"></span>
        <button id="nextBtn" aria-label="صفحه‌ی بعد"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
    </div>
  </section>

  <div class="hint" id="hint"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>برای ورق زدن به چپ بکشید</div>

  <div class="intro" id="intro">
    <div class="kicker">کافه حوریا · منوی سه‌بعدی</div>
    <h1>منو رو ورق بزن،<br><b>غذا میاد بیرون!</b></h1>
    <p>هر صفحه یک غذاست. صفحه را ورق بزنید تا غذا از دل منو بالا بیاید.</p>
    <button class="cta" id="enterBtn">ورود به منو</button>
    <div class="credit">@with.hoorya</div>
  </div>



<script>
(() => {
'use strict';
/* ---------- data ---------- */
const CATS = [
  {id:'pizza',  name:'پیتزا'},
  {id:'burger', name:'برگر'},
  {id:'side',   name:'پیش‌غذا'},
  {id:'drink',  name:'نوشیدنی'},
  {id:'dessert',name:'دسر و بستنی'},
];
// fx = which food sound plays as the dish comes out: hot -> sizzle, cold/fizz -> ice
const DISHES = [
  {id:'pizza-roastbeef', cat:'pizza',  name:'پیتزا رست بیف',        price:1485000, fx:'hot',  desc:'رست بیف ریش‌ریش، موتزارلای طلایی، ذرت و فلفل دلمه‌ای.'},
  {id:'pizza-garlic',    cat:'pizza',  name:'پیتزا سیر و استیک',     price:1465000, fx:'hot',  desc:'برش‌های استیک با سس سیر، زیتون سیاه، قارچ و موتزارلا.'},
  {id:'pizza-chicken',   cat:'pizza',  name:'پیتزا قارچ و مرغ',      price:1395000, fx:'hot',  desc:'تکه‌های مرغ، قارچ، فلفل دلمه‌ای و پنیر کش‌دار.'},
  {id:'pizza-special',   cat:'pizza',  name:'پیتزا اسپشیال',        price:1420000, fx:'hot',  desc:'ژامبون، سالامی، قارچ، زیتون سیاه و فلفل‌های رنگی.'},
  {id:'burger-charcoal', cat:'burger', name:'برگر ذغالی',            price:1285000, fx:'hot',  desc:'نان بریوش کنجدی، گوشت گریل‌شده، پنیر چدار، کاهو، گوجه و سس کچاپ.'},
  {id:'burger-royal',    cat:'burger', name:'برگر رویال',            price:1345000, fx:'hot',  desc:'نان نرم طلایی، دو لایه گوشت گریل، چدار آب‌شده، کاهو، گوجه و خیارشور.'},
  {id:'burger-double',   cat:'burger', name:'برگر دوبل',             price:1375000, fx:'hot',  desc:'نان کنجدی، دو گوشت آبدار با چدار، پیاز کاراملی، فلفل کبابی و سس صورتی.'},
  {id:'fries',           cat:'side',   name:'سیب‌زمینی سرخ‌کرده',    price:1125000, fx:'hot',  desc:'سیب‌زمینی طلایی و ترد با نمک دریایی.'},
  {id:'juice-orange',    cat:'drink',  name:'آب‌پرتقال تازه',        price:575000, fx:'cold', desc:'پرتقال تازه با یخ و برش پرتقال.'},
  {id:'cola',            cat:'drink',  name:'نوشابه لیوانی کوکا',    price:535000, fx:'cold', desc:'نوشابه‌ی خنک با یخ.'},
  {id:'icecream-lotus',  cat:'dessert',name:'بستنی لوتوس',           price:600000, fx:'cold', desc:'بستنی وانیلی، کرم لوتوس، کادایف ترد و لایه‌ی شکلات.'},
  {id:'icecream-cone',   cat:'dessert',name:'بستنی قیفی توت‌فرنگی',   price:560000, fx:'cold', desc:'دو اسکوپ توت‌فرنگی در قیف ترد با توت‌فرنگی تازه.'},
  {id:'icecream-saffron',cat:'dessert',name:'بستنی سنتی زعفرانی',    price:570000, fx:'cold', desc:'بستنی زعفرانی با گلاب، پسته و گلبرگ رز.'},
];
// per clip: duration, rise (s: the dish starts coming out of the page), land (s: it is fully out)
const CLIPS = {"burger-charcoal":{"duration":4.467,"rise":1.35,"land":3.03},"pizza-roastbeef":{"duration":3.5,"rise":0.75,"land":2.12},"fries":{"duration":2.967,"rise":0.56,"land":2.06},"cola":{"duration":2.967,"rise":0.56,"land":1.26},"juice-orange":{"duration":3.967,"rise":0.56,"land":2.06},"pizza-garlic":{"duration":2.9,"rise":0.56,"land":2.06},"burger-royal":{"duration":5.533,"rise":1.45,"land":3.18},"icecream-lotus":{"duration":2.967,"rise":0.56,"land":1.26},"icecream-cone":{"duration":2.967,"rise":0.56,"land":1.26},"icecream-saffron":{"duration":2.967,"rise":0.56,"land":1.26},"burger-double":{"duration":5.9,"rise":0.6100000000000001,"land":2.14},"pizza-special":{"duration":2.667,"rise":0.6100000000000001,"land":2.14},"pizza-chicken":{"duration":4.067,"rise":0.95,"land":2.42}};
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const price = n => fa(String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '٬'));
const $ = id => document.getElementById(id);

/* ---------- state ---------- */
let idx = 0, busy = false, soundOn = false;
const vids = [$('vA'), $('vB')]; let front = 0;

/* ---------- every clip is downloaded up front, so a page never waits or stutters on its first frames ---------- */
const blobs = {};
function preloadAll(){
  return Promise.all(DISHES.map(d => fetch('media/' + d.id + '.mp4').then(r => r.blob()).then(b => { blobs[d.id] = URL.createObjectURL(b); }).catch(() => {})));
}
const srcOf = d => blobs[d.id] || ('media/' + d.id + '.mp4');
function loadInto(v, d){
  return new Promise(res => {
    let done = false; const fin = () => { if(!done){ done = true; res(); } };
    v.src = srcOf(d); v.currentTime = 0;
    v.addEventListener('canplaythrough', fin, {once:true}); v.addEventListener('loadeddata', () => setTimeout(fin, 60), {once:true});
    setTimeout(fin, 1500); v.load();
  });
}

/* ---------- audio (WebAudio, unlocked on the first tap); files are levelled at build time ---------- */
let ac = null; const buf = {}; let foodSrc = null;
async function loadSfx(){
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    await Promise.all(['flip','rise','pop','sizzle','ice'].map(async k => {
      const r = await fetch('media/sfx/' + k + '.mp3'); buf[k] = await ac.decodeAudioData(await r.arrayBuffer());
    }));
  }catch(e){ ac = null; }
}
function play(k, gain=1, delay=0){
  if(!soundOn || !ac || !buf[k]) return null;
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf[k]; g.gain.value = gain;
  s.connect(g).connect(ac.destination); s.start(ac.currentTime + Math.max(0, delay));
  return {s, g};
}
function stopFood(){
  if(!foodSrc || !ac) return; const {s, g} = foodSrc; foodSrc = null;
  try{ g.gain.setTargetAtTime(0, ac.currentTime, .1); s.stop(ac.currentTime + .5); }catch(e){}
}
function setSound(on){
  soundOn = on; $('soundBtn').setAttribute('aria-pressed', on);
  $('waves').setAttribute('opacity', on ? '1' : '.35');
  if(on && ac && ac.state === 'suspended') ac.resume();
  if(!on) stopFood();
}
// the sound design follows each clip: the page turns, the dish rises out of the paper and lands,
// then its own sound (sizzle for hot food, ice and fizz for cold drinks and ice creams)
function dishSounds(d){
  const c = CLIPS[d.id] || {rise:.6, land:1.6};
  stopFood();
  play('flip', 1, .05);
  play('rise', .85, c.rise);
  play('pop', 1, c.land);
  foodSrc = play(d.fx === 'hot' ? 'sizzle' : 'ice', 1, c.rise + .35);
}

/* ---------- rendering ---------- */
function renderCats(){
  const nav = $('cats'); nav.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = c.name; b.dataset.cat = c.id;
    b.addEventListener('click', () => { const i = DISHES.findIndex(d => d.cat === c.id); if(i >= 0 && i !== idx) go(i); });
    nav.appendChild(b);
  });
}
// the dishes of the current category as thumbnails, so every pizza / burger is one tap away
function renderItems(){
  const d = DISHES[idx], row = $('items'); row.innerHTML = '';
  DISHES.forEach((x, i) => {
    if(x.cat !== d.cat) return;
    const b = document.createElement('button'); b.className = 'thumb'; b.setAttribute('aria-pressed', i === idx);
    b.innerHTML = `<img src="media/${x.id}.jpg" alt=""><span>${x.name.replace(/^(پیتزا|برگر|بستنی) /, '')}</span>`;
    b.onclick = () => { if(i !== idx) go(i); };
    row.appendChild(b);
  });
  row.hidden = row.children.length < 2;
}
function renderCard(){
  const d = DISHES[idx], c = CATS.find(c => c.id === d.cat);
  $('dCat').textContent = c.name; $('dName').textContent = d.name; $('dDesc').textContent = d.desc;
  $('dPrice').innerHTML = `${price(d.price)} <small>تومان</small>`;
  $('pageNo').textContent = fa(idx + 1) + ' از ' + fa(DISHES.length);
  document.querySelectorAll('.chip').forEach(b => {
    const on = b.dataset.cat === d.cat; b.setAttribute('aria-pressed', on);
    if(on) b.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  });
  renderItems();
}

/* ---------- turning to another dish: the clip itself turns the page and brings the dish out ---------- */
async function go(i){
  if(busy || i < 0 || i >= DISHES.length || i === idx) return;
  busy = true;
  const cur = vids[front], next = vids[1 - front], d = DISHES[i];
  await loadInto(next, d);
  idx = i; front = 1 - front;
  const swap = $('swap'); swap.classList.add('out');
  // short crossfade from the finished dish to the next clip's open menu, then the clip plays once and stops
  next.style.opacity = 0; next.hidden = false;
  next.play().catch(()=>{});
  dishSounds(d);
  next.animate([{opacity:0},{opacity:1}], {duration:220, easing:'ease-out', fill:'forwards'}).finished.then(() => {
    next.style.opacity = 1; cur.pause(); cur.hidden = true;
  });
  setTimeout(() => { renderCard(); swap.classList.remove('out'); }, 260);
  setTimeout(() => { busy = false; }, 450);
}

/* ---------- input: swipe, taps on the page edges, keys ---------- */
let sx = 0, sy = 0, st = 0, tracking = false;
const stage = $('stage');
stage.addEventListener('pointerdown', e => { tracking = true; sx = e.clientX; sy = e.clientY; st = performance.now(); });
stage.addEventListener('pointerup', e => {
  if(!tracking) return; tracking = false;
  const dx = e.clientX - sx, dy = e.clientY - sy, w = stage.clientWidth;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { go(idx + (dx < 0 ? 1 : -1)); return; }   // finger to the left = next page (the menu page turns to the left)
  if(Math.abs(dx) < 10 && Math.abs(dy) < 10 && performance.now() - st < 400){
    const x = e.clientX - stage.getBoundingClientRect().left;
    if(x < w * .3) go(idx + 1); else if(x > w * .7) go(idx - 1);
  }
});
$('nextBtn').onclick = () => go(idx + 1);
$('prevBtn').onclick = () => go(idx - 1);
addEventListener('keydown', e => { if(e.key === 'ArrowLeft') go(idx + 1); if(e.key === 'ArrowRight') go(idx - 1); });
$('soundBtn').onclick = () => setSound(!soundOn);

/* ---------- start ---------- */
renderCats(); renderCard();
$('intro').style.setProperty('--intro-img', 'url(media/pizza-chicken.jpg)');
const ready = preloadAll();
loadInto(vids[0], DISHES[0]);
$('enterBtn').onclick = async () => {
  const btn = $('enterBtn'); btn.disabled = true; btn.textContent = 'در حال آماده‌سازی…';
  const sfx = loadSfx();                       // the AudioContext is created inside this tap (required on iOS)
  await Promise.race([ready, new Promise(r => setTimeout(r, 6000))]);
  await sfx; setSound(true);
  await loadInto(vids[0], DISHES[0]);
  $('intro').classList.add('gone');
  vids[0].play().catch(()=>{});
  dishSounds(DISHES[0]);
  setTimeout(() => { const h = $('hint'); h.classList.add('show'); setTimeout(() => h.classList.remove('show'), 3600); }, 4200);
};
DISHES.forEach(d => { const im = new Image(); im.src = 'media/' + d.id + '.jpg'; });
})();
</script>
</body>
</html>
